  <!-- label -->
  <g>
    <rect x="140" y="700" width="360" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <circle cx="164" cy="717" r="5" fill="#22C55E" />
    <text x="182" y="722" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Gym Management System</text>
  </g>
  <text x="1000" y="722" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Preview coming soon</text>
