<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)" />

  <!-- faint grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 100H1280M0 200H1280M0 300H1280M0 400H1280M0 500H1280M0 600H1280M0 700H1280" />
    <path d="M107 0V800M214 0V800M321 0V800M428 0V800M535 0V800M642 0V800M749 0V800M856 0V800M963 0V800M1070 0V800M1177 0V800" />
  </g>

  <!-- glow blobs -->
  <circle cx="220" cy="150" r="220" fill="#2563EB" opacity="0.18" />
  <circle cx="1080" cy="650" r="240" fill="#7C3AED" opacity="0.16" />

  <!-- dashboard window -->
  <g>
    <rect x="140" y="150" width="1000" height="520" rx="20" fill="#0f172a" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- window chrome -->
    <circle cx="176" cy="184" r="6" fill="#f87171" />
    <circle cx="198" cy="184" r="6" fill="#fbbf24" />
    <circle cx="220" cy="184" r="6" fill="#4ade80" />
    <rect x="140" y="150" width="1000" height="44" rx="20" fill="#ffffff" fill-opacity="0.04" />

