    <rect x="184" y="250" width="100" height="10" rx="5" fill="url(#accent)" />
    <rect x="184" y="284" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="184" y="312" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="184" y="340" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="184" y="368" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.18" />

    <!-- stat cards -->
    <g>
      <rect x="328" y="222" width="180" height="90" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="352" y="248" width="60" height="10" rx="5" fill="#93c5fd" />
      <rect x="352" y="272" width="90" height="16" rx="6" fill="#ffffff" fill-opacity="0.85" />

      <rect x="528" y="222" width="180" height="90" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="552" y="248" width="60" height="10" rx="5" fill="#c4b5fd" />
      <rect x="552" y="272" width="90" height="16" rx="6" fill="#ffffff" fill-opacity="0.85" />

      <rect x="728" y="222" width="180" height="90" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="752" y="248" width="60" height="10" rx="5" fill="#67e8f9" />
      <rect x="752" y="272" width="90" height="16" rx="6" fill="#ffffff" fill-opacity="0.85" />
    </g>

    <!-- chart card -->
    <rect x="328" y="332" width="580" height="306" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
    <rect x="352" y="356" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.75" />

    <!-- bar chart -->
    <g>
      <rect x="368" y="500" width="46" height="110" rx="8" fill="url(#bar1)" />
      <rect x="430" y="460" width="46" height="150" rx="8" fill="url(#bar2)" />
      <rect x="492" y="530" width="46" height="80" rx="8" fill="url(#bar3)" />
      <rect x="554" y="440" width="46" height="170" rx="8" fill="url(#bar1)" opacity="0.85" />
      <rect x="616" y="490" width="46" height="120" rx="8" fill="url(#bar2)" opacity="0.85" />
      <rect x="678" y="470" width="46" height="140" rx="8" fill="url(#bar3)" opacity="0.85" />
      <rect x="740" y="510" width="46" height="100" rx="8" fill="url(#bar1)" opacity="0.7" />
      <rect x="802" y="480" width="46" height="130" rx="8" fill="url(#bar2)" opacity="0.7" />
    </g>
    <line x1="352" y1="610" x2="884" y2="610" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
